<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>子平命盘 · 学者工具</title>
<meta name="description" content="子平八字排盘与岁运推演：真太阳时、节气查表、格局用神量化、岁运应期、案例复盘。纯前端单引擎，离线可用。">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23b5402a'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='%23f7f2e7' font-family='serif'%3E命%3C/text%3E%3C/svg%3E">
</head>
<body>

<header class="site-header">
    <div class="wrap header-inner">
        <div class="brand">
            <span class="seal" aria-hidden="true">命</span>
            <div class="brand-text">
                <h1>子平命盘</h1>
                <p>学者工具 · 量化子平 · 离线单引擎</p>
            </div>
        </div>
        <nav class="header-actions" aria-label="全局操作">
            <button type="button" class="btn ghost" id="btnCases">案例库</button>
            <button type="button" class="btn ghost" id="btnShare">分享</button>
            <button type="button" class="btn ghost" id="btnExport">导出</button>
            <button type="button" class="btn ghost" id="btnPrint">打印</button>
        </nav>
    </div>
</header>

<main class="wrap">

    <!-- ======================= 输入区 ======================= -->
    <section class="card input-card" id="inputCard" aria-label="排盘输入">
        <form id="birthForm" autocomplete="off">
            <div class="input-grid">
                <label class="field">
                    <span class="field-label">姓名</span>
                    <input type="text" id="fName" placeholder="命主姓名（可空）" maxlength="20">
                </label>
                <div class="field">
                    <span class="field-label">性别</span>
                    <div class="seg" role="radiogroup" aria-label="性别">
                        <button type="button" class="seg-btn active" data-name="gender" data-value="male">男</button>
                        <button type="button" class="seg-btn" data-name="gender" data-value="female">女</button>
                    </div>
                </div>
                <div class="field">
                    <span class="field-label">历法</span>
                    <div class="seg" role="radiogroup" aria-label="历法">
                        <button type="button" class="seg-btn active" data-name="calendar" data-value="solar">公历</button>
                        <button type="button" class="seg-btn" data-name="calendar" data-value="lunar">农历</button>
                    </div>
                </div>
                <label class="field">
                    <span class="field-label">出生日期</span>
                    <input type="date" id="fDate" min="1900-01-01" max="2100-12-31" required>
                </label>
                <label class="field" id="leapField" hidden>
                    <span class="field-label">闰月</span>
                    <div class="seg">
                        <button type="button" class="seg-btn active" data-name="leap" data-value="0">本月</button>
                        <button type="button" class="seg-btn" data-name="leap" data-value="1">闰月</button>
                    </div>
                </label>
                <label class="field" id="timeField">
                    <span class="field-label">出生时间</span>
                    <input type="time" id="fTime" value="12:00">
                </label>
                <label class="field">
                    <span class="field-label">时辰（辅助校验）</span>
                    <select id="fShichen">
                        <option value="">不指定</option>
                    </select>
                </label>
                <label class="field field-wide">
                    <span class="field-label">出生地（经度校正）</span>
                    <input type="text" id="fCity" list="cityList" placeholder="输入城市，如：乌鲁木齐 /  London">
                    <datalist id="cityList"></datalist>
                </label>
                <label class="field">
                    <span class="field-label">经度 °E</span>
                    <input type="number" id="fLon" step="0.01" min="-180" max="180" value="120">
                </label>
                <label class="field">
                    <span class="field-label">时区</span>
                    <select id="fTz"></select>
                </label>
                <div class="field">
                    <span class="field-label">真太阳时</span>
                    <div class="seg">
                        <button type="button" class="seg-btn" data-name="trueSolar" data-value="1">启用</button>
                        <button type="button" class="seg-btn active" data-name="trueSolar" data-value="0">关闭</button>
                    </div>
                </div>
                <div class="field">
                    <span class="field-label">子时流派</span>
                    <div class="seg">
                        <button type="button" class="seg-btn active" data-name="ziSchool" data-value="late">晚子时换日</button>
                        <button type="button" class="seg-btn" data-name="ziSchool" data-value="early">早子时不换</button>
                    </div>
                </div>
                <div class="field">
                    <span class="field-label">夏令时</span>
                    <div class="seg">
                        <button type="button" class="seg-btn active" data-name="dst" data-value="auto">自动</button>
                        <button type="button" class="seg-btn" data-name="dst" data-value="on">强制开</button>
                        <button type="button" class="seg-btn" data-name="dst" data-value="off">关闭</button>
                    </div>
                </div>
                <div class="field">
                    <span class="field-label">时辰未知</span>
                    <div class="seg">
                        <button type="button" class="seg-btn active" data-name="hourUnknown" data-value="0">已知</button>
                        <button type="button" class="seg-btn" data-name="hourUnknown" data-value="1">三柱模式</button>
                    </div>
                </div>
            </div>
            <div class="input-foot">
                <button type="submit" class="btn primary" id="btnCompute">排盘</button>
                <button type="button" class="btn ghost" id="btnSaveCase" disabled>存入案例库</button>
                <span class="input-note" id="inputNote">节气查表 1900–2100 · 真太阳时含均时差 · 中国夏令时 1986–1991 自动识别</span>
            </div>
        </form>
        <div class="warnings" id="warnings" hidden></div>
    </section>

    <!-- ======================= 结果区 ======================= -->
    <div id="resultArea" hidden>

        <section class="card chart-banner" id="chartBanner" aria-label="命盘概要"></section>

        <nav class="tabs" id="tabs" aria-label="结果分页">
            <button type="button" class="tab active" data-tab="mingpan">命盘</button>
            <button type="button" class="tab" data-tab="wuxing">五行</button>
            <button type="button" class="tab" data-tab="geju">格局用神</button>
            <button type="button" class="tab" data-tab="suiyun">岁运</button>
            <button type="button" class="tab" data-tab="liuyue">流月</button>
            <button type="button" class="tab" data-tab="duanyu">断语</button>
            <button type="button" class="tab" data-tab="hepan">合盘</button>
            <button type="button" class="tab" data-tab="fupan">复盘</button>
            <button type="button" class="tab" data-tab="params">参数</button>
        </nav>

        <section class="tab-page active" id="page-mingpan"></section>
        <section class="tab-page" id="page-wuxing"></section>
        <section class="tab-page" id="page-geju"></section>
        <section class="tab-page" id="page-suiyun"></section>
        <section class="tab-page" id="page-liuyue"></section>
        <section class="tab-page" id="page-duanyu"></section>
        <section class="tab-page" id="page-hepan"></section>
        <section class="tab-page" id="page-fupan"></section>
        <section class="tab-page" id="page-params"></section>

    </div>

    <div id="emptyState" class="empty-state">
        <div class="empty-seal" aria-hidden="true">造命</div>
        <p>录入生辰，立见四柱。</p>
        <p class="empty-sub">量化子平 · 格局成败 · 岁运应期 · 案例复盘</p>
    </div>

</main>

<!-- ======================= 案例库抽屉 ======================= -->
<div class="drawer-mask" id="drawerMask" hidden></div>
<aside class="drawer" id="caseDrawer" aria-label="案例库" hidden>
    <div class="drawer-head">
        <h2>案例库</h2>
        <button type="button" class="btn ghost" id="btnCloseDrawer">关闭</button>
    </div>
    <div class="drawer-tools">
        <input type="search" id="caseSearch" placeholder="搜索姓名 / 四柱 / 格局…">
        <div class="drawer-tool-btns">
            <button type="button" class="btn ghost" id="btnExportCases">导出全部</button>
            <button type="button" class="btn ghost" id="btnImportCases">导入</button>
            <input type="file" id="importFile" accept=".json,application/json" hidden>
        </div>
    </div>
    <div class="case-list" id="caseList"></div>
    <div class="drawer-batch">
        <h3>批量排盘 → CSV</h3>
        <textarea id="batchInput" rows="4" placeholder="每行一条：姓名,性别,1990-06-15 10:00&#10;张三,男,1985-03-08 08:30&#10;李四,女,1992-08-20 14:00"></textarea>
        <button type="button" class="btn ghost" id="btnBatch">生成 CSV</button>
    </div>
</aside>

<div class="toast" id="toast" role="status" hidden></div>

<footer class="site-footer">
    <div class="wrap">
        <p>子平命盘 · 纯前端单引擎 · 数据不出本机</p>
        <p class="footer-sub">命理为传统数术文化，量化结果供研究参考，不作人生决策的唯一依据。</p>
    </div>
</footer>

<script src="js/data-terms.js"></script>
<script src="js/data-lunar.js"></script>
<script src="js/data-cities.js"></script>
<script src="js/bazi.js"></script>
<script src="js/app.js"></script>
</body>
</html>
